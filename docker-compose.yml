# Local Postgres for development. Start: docker compose up -d
# DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/layla
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: layla
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
